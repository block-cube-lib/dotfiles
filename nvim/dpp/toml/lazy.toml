[[plugins]]
repo = 'folke/tokyonight.nvim'
on_event = 'VimEnter'
hook_post_source = '''
colorscheme tokyonight-night
'''
lua_source = '''
require("tokyonight").setup({
transparent = true,
    styles = {
        sidebars = "transparent",
        floats = "transparent",
    },
})
'''

[[plugins]]
repo = 'Shougo/deol.nvim'
on_event = 'VimEnter'
hooks_file = '$XDG_CONFIG_HOME/nvim/dpp/hooks/deol.lua'

[[plugins]]
repo = 'skk-dev/dict'
name = 'skk-dict'

[[plugins]]
repo = 'vim-skk/skkeleton'
# CmdlineEnter too: the <C-j> toggle map is registered at
# startup, so entering the command line before any InsertEnter
# would expand it to a <Plug> that does not exist yet (the
# literal text lands in the command line). Loading on
# CmdlineEnter makes the toggle always available there.
on_event = ['InsertEnter', 'CmdlineEnter']
depends = ['denops.vim', 'skk-dict']
hooks_file = '$XDG_CONFIG_HOME/nvim/dpp/hooks/skkeleton.lua'

[[plugins]]
repo = 'delphinus/skkeleton_indicator.nvim'
on_event = 'InsertEnter'
depends = ['skkeleton']
lua_source = '''
require("skkeleton_indicator").setup()
'''
